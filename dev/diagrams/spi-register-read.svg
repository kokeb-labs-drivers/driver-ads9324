<svg xmlns="http://www.w3.org/2000/svg" width="638" height="343" viewBox="0 0 638 343" role="img" aria-labelledby="spi-register-read-title spi-register-read-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="spi-register-read-title">One register read on the SPI bus</title>
<desc id="spi-register-read-desc">A register read on the ADS9324 SPI bus: the host sends the read command inside one chip-select frame, then clocks out a second frame in which the chip returns the value on SDOUT.</desc>
<defs><marker id="spi-register-read-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>
