<text x="319" y="171.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">CS low, 0x01 0xAA 0x01 (GEN_CFG1: read register 0xAA), CS high</text>
<rect x="237.2" y="200.8" width="163.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="319" y="215.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">CS low, 0x00 0x00 0x00</text>
