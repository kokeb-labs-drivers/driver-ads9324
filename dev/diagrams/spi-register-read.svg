<rect x="39.6" y="88.8" width="130" height="52" rx="10" fill="#FDF0FF" stroke="#A21CAF" stroke-width="1.4"/>
<rect x="39.6" y="96.8" width="4" height="36" rx="2" fill="#A21CAF"/>
