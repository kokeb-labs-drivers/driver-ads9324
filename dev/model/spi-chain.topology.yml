# Model of the figure 'spi-chain'. Edit this file; `kokeb-docs figures` draws it. Never edit the SVGs.
# Every number cites the datasheet section and page it comes from (`ref`, a name under refs here or in
# docs/hardware.yml); a number without one fails the build. Keys: docs/figkit.md in ci-tools.
kind: topology
id: spi-chain
title: Configuration SPI daisy chain
kicker: Several devices
alt: >-
  Daisy chain of two ADS9324 on the configuration SPI: the host's PICO feeds SDI of ADC2, its SDOUT feeds SDI of
  ADC1 and the SDOUT of ADC1 returns to POCI, with SCLK and CS shared.
reads: >-
  The host drives PICO into SDI of ADC2; the SDOUT of ADC2 feeds SDI of ADC1, whose SDOUT returns to the host's POCI.
  SCLK and CS are rails the host and both ADCs share, so one CS low phase carries a register frame for each device.
  The driver does not support this chain.
style: chain
refs:
  chain: {doc: ds, section: "7.3.14.2 Daisy Chain, Figure 7-29", page: 43}
host: {label: Host, detail: SPI controller}
nodes:
  - {label: ADC2, detail: first on PICO, address: "DAISY_CHN_LOC = 1", ref: chain}
  - {label: ADC1, detail: last in the chain, address: "DAISY_CHN_LOC = 0", ref: chain}
chain: {in: SDI, out: SDOUT, host_out: PICO, host_in: POCI}
shared: [SCLK, CS]
facts:
  - {text: "A register read or write takes 32 SCLK per device in the chain instead of 24", ref: chain}
  - {text: "Every device needs DAISY_CHN_NUM, DAISY_CHN_LOC and DOUT_LANE_SEL set, then DAISY_CHN_EN = 1", ref: chain}
  - {text: "Data on 1, 2 or 4 lanes only; not with the data on SDOUT", ref: chain}
