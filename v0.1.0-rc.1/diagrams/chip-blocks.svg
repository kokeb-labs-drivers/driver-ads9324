<text x="168" y="184.6" font-size="13" font-weight="700" fill="#334155">ADS9324</text>
<text x="245.1" y="184.6" font-size="12" fill="#334155">VQFN-64</text>
<text x="212" y="250.3" font-size="15" font-weight="700" fill="#0B5F59">Input</text>
<text x="212" y="269.8" font-size="15" font-weight="700" fill="#0B5F59">clamps and</text>
<text x="212" y="289.3" font-size="15" font-weight="700" fill="#0B5F59">PGA</text>
<text x="212" y="314.1" font-size="13" fill="#2B3442">1 MΩ inputs, 5</text>
<text x="212" y="333" font-size="13" fill="#2B3442">ranges,</text>
<text x="212" y="351.9" font-size="13" fill="#2B3442">per-channel</text>
<text x="212" y="370.7" font-size="13" fill="#2B3442">gain</text>
<text x="444" y="250.3" font-size="15" font-weight="700" fill="#5B21B6">16 SAR</text>
<text x="444" y="269.8" font-size="15" font-weight="700" fill="#5B21B6">ADCs</text>
<text x="444" y="294.6" font-size="13" fill="#2B3442">simultaneous</text>
<text x="444" y="313.5" font-size="13" fill="#2B3442">sampling, 1</text>
<text x="444" y="332.4" font-size="13" fill="#2B3442">MSPS each</text>
<text x="212" y="466.3" font-size="15" font-weight="700" fill="#8A3C0B">Reference</text>
<text x="212" y="491.2" font-size="13" fill="#2B3442">4.096 V</text>
<text x="212" y="510" font-size="13" fill="#2B3442">internal, or</text>
<text x="212" y="528.9" font-size="13" fill="#2B3442">external on</text>
<text x="212" y="547.7" font-size="13" fill="#2B3442">REFIO</text>
<text x="676" y="250.3" font-size="15" font-weight="700" fill="#1E429F">Digital</text>
<text x="676" y="269.8" font-size="15" font-weight="700" fill="#1E429F">filters and</text>
<text x="676" y="289.3" font-size="15" font-weight="700" fill="#1E429F">calibration</text>
<text x="676" y="314.1" font-size="13" fill="#2B3442">offset, gain,</text>
<text x="676" y="333" font-size="13" fill="#2B3442">phase, FIR,</text>
<text x="676" y="351.9" font-size="13" fill="#2B3442">averages</text>
<text x="908" y="250.3" font-size="15" font-weight="700" fill="#1E429F">Data</text>
<text x="908" y="269.8" font-size="15" font-weight="700" fill="#1E429F">interface</text>
<text x="908" y="294.6" font-size="13" fill="#2B3442">1, 2, 4 or 8</text>
<text x="908" y="313.5" font-size="13" fill="#2B3442">lanes, 16 or</text>
<text x="908" y="332.4" font-size="13" fill="#2B3442">24 bit</text>
<text x="908" y="466.3" font-size="15" font-weight="700" fill="#1E429F">Registers</text>
<text x="908" y="485.8" font-size="15" font-weight="700" fill="#1E429F">and control</text>
<text x="908" y="510.7" font-size="13" fill="#2B3442">three banks,</text>
<text x="908" y="529.5" font-size="13" fill="#2B3442">24-bit frames,</text>
<text x="908" y="548.4" font-size="13" fill="#2B3442">CONVST</text>
<text x="676" y="466.3" font-size="15" font-weight="700" fill="#8A3C0B">Window</text>
<text x="676" y="485.8" font-size="15" font-weight="700" fill="#8A3C0B">comparator</text>
<text x="676" y="505.3" font-size="15" font-weight="700" fill="#8A3C0B">and alarm</text>
<text x="676" y="530.2" font-size="13" fill="#2B3442">per-channel</text>
<text x="676" y="549" font-size="13" fill="#2B3442">limits</text>
<text x="138" y="276.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">AIN1P  57</text>
<text x="138" y="300.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">AIN1M  58</text>
<text x="138" y="324.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">AIN16P  23</text>
<text x="138" y="348.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">AIN16M  24</text>
<text x="138" y="468.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">REFIO  54</text>
<text x="138" y="492.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">REFSEL  31</text>
<text x="138" y="516" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">REFCAPA  52</text>
<text x="138" y="540" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">REFCAPB  29</text>
<text x="1070" y="284.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">D0*  46</text>
<text x="1070" y="308.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">D7*  39</text>
<text x="1070" y="332.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SDOUT  38</text>
<text x="1070" y="460.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">CS  35</text>
<text x="1070" y="484.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SCLK  37</text>
<text x="1070" y="508.1" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SDI  36</text>
<text x="1070" y="532" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">RESET  32</text>
<text x="1070" y="556" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">CONVST  50</text>
