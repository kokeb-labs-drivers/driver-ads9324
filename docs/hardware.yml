  - {number: 39, name: D7, type: digital-io, domain: IOVDD,
     function: "Serial output data lane 7", hook: lanes, unused: Leave open, unverified: "the data sheet does not say how to terminate an unused data lane", ref: pins}
  - {number: 40, name: D6, type: digital-io, domain: IOVDD,
     function: "Serial output data lane 6", hook: lanes, unused: Leave open, unverified: "the data sheet does not say how to terminate an unused data lane", ref: pins}
  - {number: 41, name: D5, type: digital-io, domain: IOVDD,
     function: "Serial output data lane 5", hook: lanes, unused: Leave open, unverified: "the data sheet does not say how to terminate an unused data lane", ref: pins}
  - {number: 42, name: D4, type: digital-io, domain: IOVDD,
