  - {number: 32, name: RESET, type: digital-in, domain: IOVDD,
     function: "Hardware reset, active low", hook: reset, ref: pins}
  - {number: 33, name: GND, type: ground, domain: GND,
     function: "Ground", ref: pins}
  - {number: 34, name: IOVDD, type: power, domain: IOVDD,
     function: "Digital I/O supply, 1.7 V to 3.6 V; 1 µF and 0.1 µF to GND at each supply pin", ref: supply}
  - {number: 35, name: CS, type: bus, domain: IOVDD,
     function: "SPI chip select, active low", hook: transfer, ref: pins}
  - {number: 36, name: SDI, type: bus, domain: IOVDD,
     function: "SPI data in (MOSI)", hook: transfer, ref: pins}
  - {number: 37, name: SCLK, type: bus, domain: IOVDD,
