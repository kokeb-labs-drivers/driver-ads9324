  - {number: 26, name: AVDD_5V, type: power, domain: AVDD_5V,
     function: "5 V analog supply, 4.75 V to 5.25 V; 1 µF and 0.1 µF to GND at each supply pin", ref: supply}
  - {number: 27, name: AVDD_5V, type: power, domain: AVDD_5V,
     function: "5 V analog supply, 4.75 V to 5.25 V; 1 µF and 0.1 µF to GND at each supply pin", ref: supply}
