block_diagram:
  ref: blocks
  blocks:
    - {id: afe, label: Input clamps and PGA, detail: "1 MΩ inputs, 5 ranges, per-channel gain", at: [0, 0], tone: teal,
       pins: [AIN1P, AIN1M, AIN16P, AIN16M], side: left}
    - {id: adc, label: 16 SAR ADCs, detail: "simultaneous sampling, 1 MSPS each", at: [1, 0], tone: violet}
    - {id: ref, label: Reference, detail: "4.096 V internal, or external on REFIO", at: [0, 1], tone: amber,
       pins: [REFIO, REFSEL, REFCAPA, REFCAPB], side: left}
    - {id: dsp, label: Digital filters and calibration, detail: "offset, gain, phase, FIR, averages", at: [2, 0],
       tone: blue}
    - {id: out, label: Data interface, detail: "1, 2, 4 or 8 lanes, 16 or 24 bit", at: [3, 0], tone: blue,
       pins: [D0, D7, SDOUT], side: right}
    - {id: spi, label: Registers and control, detail: "three banks, 24-bit frames, CONVST", at: [3, 1], tone: blue,
       pins: [CS, SCLK, SDI, RESET, CONVST], side: right}
    - {id: dwc, label: Window comparator and alarm, detail: "per-channel limits", at: [2, 1], tone: amber}
  links:
    - {from: afe, to: adc, label: analog}
    - {from: ref, to: adc, label: VREF}
    - {from: adc, to: dsp, label: codes}
    - {from: dsp, to: out, label: results}
    - {from: dsp, to: dwc, label: codes}
    - {from: spi, to: dsp, label: settings}

circuits:
  - id: typical
    title: Typical application
    description: >-
      One channel of the ADS9324 with the internal reference (REFSEL high), the data on SDOUT (1 lane) and the three
      supplies decoupled as Figure 9-4 shows; CONVST, RESET and DRDY/ALARM are on GPIOs the driver uses through
      GpioSet() and GpioGet(). The other fifteen channels repeat the input filter.
    ref: app
    parts:
      - {id: U1, kind: chip}
      - id: U2
        kind: mcu
        label: MCU
        pins:
          - {name: SCK, label: SPI SCK}
          - {name: MOSI, label: SPI MOSI}
          - {name: MISO, label: SPI MISO}
          - {name: CS, label: GPIO / CS}
          - {name: RST, label: GPIO}
          - {name: CNV, label: GPIO / timer}
          - {name: RDY, label: GPIO (IRQ)}
          - VDD
          - GND
      - {id: C1, kind: capacitor, value: 1 µF, ref: supply}
      - {id: C2, kind: capacitor, value: 0.1 µF, ref: supply}
      - {id: C3, kind: capacitor, value: 1 µF, ref: supply}
      - {id: C4, kind: capacitor, value: 0.1 µF, ref: supply}
      - {id: C5, kind: capacitor, value: 1 µF, ref: supply}
      - {id: C6, kind: capacitor, value: 0.1 µF, ref: supply}
      - {id: C7, kind: capacitor, value: 4.7 µF, ref: pins}
      - {id: C8, kind: capacitor, value: 1 µF, ref: pins}
      - {id: C9, kind: capacitor, value: 1 µF, ref: pins}
      - {id: R1, kind: resistor, value: 1 kΩ, ref: app,
         unverified: "REXT: the data sheet gives no value; choose it for the source and the input filter"}
      - {id: R2, kind: resistor, value: 1 kΩ, ref: app,
         unverified: "REXT: matched to R1 so the positive and negative paths see equal source resistance"}
      - {id: C10, kind: capacitor, value: 10 nF, ref: app,
         unverified: "CEXT: the data sheet gives no value; it sets the filter corner with REXT"}
    nets:
      - {name: "+5V", kind: supply, nodes: [U1.AVDD_5V, C1.1, C2.1]}
      - {name: "+1V8", kind: supply, nodes: [U1.AVDD_1V8, C3.1, C4.1]}
      - {name: "+3V3", kind: supply, nodes: [U1.IOVDD, C5.1, C6.1, U1.REFSEL, U2.VDD],
         unverified: "example IOVDD; the data sheet allows 1.7 V to 3.6 V. REFSEL high selects the internal reference"}
      - {name: GND, kind: ground,
         nodes: [U1.GND, U1.REFM, U1.EPAD, C1.2, C2.2, C3.2, C4.2, C5.2, C6.2, C7.2, C8.2, C9.2, U2.GND]}
      - {name: REFIO, nodes: [U1.REFIO, C7.1]}
      - {name: REFCAPA, nodes: [U1.REFCAPA, C8.1]}
      - {name: REFCAPB, nodes: [U1.REFCAPB, C9.1]}
      - {name: IN1P, nodes: [U1.AIN1P, R1.2, C10.1]}
      - {name: IN1M, nodes: [U1.AIN1M, R2.2, C10.2]}
      - {name: SCLK, nodes: [U1.SCLK, U2.SCK]}
      - {name: SDI, nodes: [U1.SDI, U2.MOSI]}
      - {name: SDOUT, nodes: [U1.SDOUT, U2.MISO]}
      - {name: CS, nodes: [U1.CS, U2.CS]}
      - {name: RESET, nodes: [U1.RESET, U2.RST]}
      - {name: CONVST, nodes: [U1.CONVST, U2.CNV]}
      - {name: DRDY, nodes: [U1.DRDY/ALARM, U2.RDY]}
    unused: [U1.AIN2P, U1.AIN2M, U1.AIN3P, U1.AIN3M, U1.AIN4P, U1.AIN4M, U1.AIN5P, U1.AIN5M, U1.AIN6P, U1.AIN6M,
             U1.AIN7P, U1.AIN7M, U1.AIN8P, U1.AIN8M, U1.AIN9P, U1.AIN9M, U1.AIN10P, U1.AIN10M, U1.AIN11P, U1.AIN11M,
             U1.AIN12P, U1.AIN12M, U1.AIN13P, U1.AIN13M, U1.AIN14P, U1.AIN14M, U1.AIN15P, U1.AIN15M, U1.AIN16P,
             U1.AIN16M, U1.D0, U1.D1, U1.D2, U1.D3, U1.D4, U1.D5, U1.D6, U1.D7, R1.1, R2.1]
