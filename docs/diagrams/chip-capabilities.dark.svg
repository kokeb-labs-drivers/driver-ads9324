<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the ADS9324 does</title>
<desc id="chip-capabilities-desc">Capability map of the ADS9324: Simultaneous sampling (supported): Samples all 16 inputs at one instant on CONVST and reads the whole frame of results; Programmable gain front end (supported): Per channel: ±2.5 V to ±12.5 V, differential, single-ended or open-wire safe, 25 or 325 kHz bandwidth; Reference (supported): The internal 4.096 V reference and buffer, or an external reference; Calibration (supported): System offset, gain and phase per channel, and the chip's own ADC gain and offset calibration; Digital filters (supported): Block average, moving average or low-pass FIR filtering of the oversampled results; Window comparator (supported): Flags a channel that leaves a high and low threshold with hysteresis, on the ALARM pin; Data interface (partial): 1, 2, 4 or 8 data lanes, 16- or 24-bit words, the output randomizer and test patterns; Standby (supported): Powers down the analog front end and the reference, then wakes with the registers checked; Reset and identity (supported): Hardware or software reset, the device ID check and the reset-detect flag.</desc>
