<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1245" viewBox="0 0 640 1245" role="img" aria-labelledby="data-read-title data-read-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="data-read-title">One conversion read on SDOUT</title>
<desc id="data-read-desc">Conversion and data read of the ADS9324 in the 1-lane SDOUT mode: a low pulse on CONVST samples all channels, DRDY rises when the result is ready, and one CS frame clocks the 16 channel words out on SDOUT, AIN1 first.</desc>
