<text x="32" y="617.6" font-size="17" font-weight="700" fill="#0E1726">Values</text>
<text x="32" y="654" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">tPL_CV</text>
<text x="608" y="654" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">min 50 ns</text>
<text x="32" y="674.3" font-size="15" fill="#2B3442">CONVST pulse width (the table names it the pulse high time)</text>
<text x="32" y="694.5" font-size="14" fill="#566070">Datasheet 5.6 Timing Requirements, p. 11</text>
<text x="32" y="726.9" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">tCONVST</text>
<text x="608" y="726.9" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">min 1 µs</text>
<text x="32" y="747.2" font-size="15" fill="#2B3442">Sampling interval between two CONVST falling edges</text>
<text x="32" y="767.3" font-size="14" fill="#566070">Datasheet 5.6 Timing Requirements, p. 11</text>
<text x="32" y="799.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">td_CVDRDY_hi</text>
<text x="608" y="799.8" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">max 1.25 µs</text>
<text x="32" y="820" font-size="15" fill="#2B3442">CONVST falling to DRDY rising, equal to tCONV without oversampling</text>
<text x="32" y="840.2" font-size="14" fill="#566070">Datasheet 5.7 Switching Characteristics, p. 12</text>
<text x="32" y="872.6" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">tsu_DRDYCS</text>
<text x="608" y="872.6" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">min 0 ns</text>
<text x="32" y="892.9" font-size="15" fill="#2B3442">Setup time from DRDY rising to CS falling</text>
<text x="32" y="913" font-size="14" fill="#566070">Datasheet 5.6 Timing Requirements, p. 11</text>
<text x="32" y="945.5" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">td_CVDRDY_lo</text>
<text x="608" y="945.5" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">max 350 ns</text>
<text x="32" y="965.7" font-size="15" fill="#2B3442">CONVST falling to DRDY falling</text>
<text x="32" y="985.9" font-size="14" fill="#566070">Datasheet 5.7 Switching Characteristics, p. 12</text>
<text x="32" y="1018.3" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">fCONVST</text>
<text x="608" y="1018.3" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">min 0.1 · max 1 MHz</text>
<text x="32" y="1038.6" font-size="15" fill="#2B3442">Sampling frequency</text>
<text x="32" y="1058.7" font-size="14" fill="#566070">Datasheet 5.6 Timing Requirements, p. 11</text>
<text x="46" y="1112.9" font-size="17" font-weight="700" fill="#334155">Notes</text>
<text x="46" y="1133.3" font-size="15" fill="#334155">The 1-lane SDOUT mode is DOUT_LANE_SEL = 3 with</text>
<text x="46" y="1155" font-size="15" fill="#334155">ADC_DATA_SDOUT_EN = 1 in GEN_CFG3 (Table 7-11). With 2, 4 or 8</text>
<text x="46" y="1176.8" font-size="15" fill="#334155">lanes on D7 to D0 a 16-bit word takes 8, 4 or 2 clocks instead of 16. The</text>
<text x="46" y="1198.5" font-size="15" fill="#334155">SCLK, CS and SDOUT times of the register frame apply to this read too.</text>
