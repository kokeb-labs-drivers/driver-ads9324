<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752" role="img" aria-labelledby="chip-frame-spi-title chip-frame-spi-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-spi-title">ADS9324: SPI register frame</title>
<desc id="chip-frame-spi-desc">SPI register frame of the ADS9324, 24 bits, most significant bit first. Write: register address (bits 23 to 16), 16-bit value (bits 15 to 0); Read: 0x01 (GEN_CFG1) (bits 23 to 16), register to read (bits 15 to 8), 0x01 (read) (bits 7 to 0); Reply: 16-bit register value (bits 23 to 8), 0x00 (bits 7 to 0). Below, the SPI mode 0 waveform of one transfer in the same bit grid.</desc>
<rect x="0.5" y="0.5" width="1199" height="751" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">ADS9324: SPI register frame</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">A register write or read command is one 24-bit frame with CS low; the value read comes in the next frame. 24 bits, sent most</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">significant bit first. Datasheet: 7.5.1 Register Write Operation, Figure 7-41, p. 50.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#252F3C"/>
