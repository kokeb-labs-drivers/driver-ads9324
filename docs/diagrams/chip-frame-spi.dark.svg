<text x="240" y="191.5" font-size="16" fill="#9AA6B5">MSB, sent first</text>
<text x="1140" y="191.5" font-size="16" text-anchor="end" fill="#9AA6B5">LSB, sent last</text>
<text x="32" y="230.5" font-size="20" font-weight="700" fill="#E8EDF3">Write</text>
<text x="32" y="250.5" font-size="16" fill="#9AA6B5">SDI</text>
<text x="390" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#BFDBFE">register address</text>
<text x="242" y="275.5" font-size="16" fill="#9AA6B5">23</text>
<text x="538" y="275.5" font-size="16" text-anchor="end" fill="#9AA6B5">16</text>
<text x="840" y="238.6" font-size="17" font-weight="600" text-anchor="middle" fill="#BBF7D0">16-bit value</text>
<text x="542" y="275.5" font-size="16" fill="#9AA6B5">15</text>
<text x="1138" y="275.5" font-size="16" text-anchor="end" fill="#9AA6B5">0</text>
<text x="32" y="318.5" font-size="20" font-weight="700" fill="#E8EDF3">Read</text>
<text x="32" y="338.5" font-size="16" fill="#9AA6B5">SDI, address 0x01</text>
<text x="390" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#FDE68A">0x01 (GEN_CFG1)</text>
<text x="242" y="363.5" font-size="16" fill="#9AA6B5">23</text>
<text x="538" y="363.5" font-size="16" text-anchor="end" fill="#9AA6B5">16</text>
<text x="690" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#BFDBFE">register to read</text>
<text x="542" y="363.5" font-size="16" fill="#9AA6B5">15</text>
<text x="838" y="363.5" font-size="16" text-anchor="end" fill="#9AA6B5">8</text>
<text x="990" y="326.6" font-size="17" font-weight="600" text-anchor="middle" fill="#FDE68A">0x01 (read)</text>
<text x="842" y="363.5" font-size="16" fill="#9AA6B5">7</text>
<text x="1138" y="363.5" font-size="16" text-anchor="end" fill="#9AA6B5">0</text>
<text x="32" y="406.5" font-size="20" font-weight="700" fill="#E8EDF3">Reply</text>
<text x="32" y="426.5" font-size="16" fill="#9AA6B5">SDOUT, next frame</text>
<text x="540" y="414.6" font-size="17" font-weight="600" text-anchor="middle" fill="#BBF7D0">16-bit register value</text>
<text x="242" y="451.5" font-size="16" fill="#9AA6B5">23</text>
<text x="838" y="451.5" font-size="16" text-anchor="end" fill="#9AA6B5">8</text>
<text x="990" y="414.6" font-size="17" font-weight="600" text-anchor="middle" fill="#E2E8F0">0x00</text>
<text x="842" y="451.5" font-size="16" fill="#9AA6B5">7</text>
<text x="1138" y="451.5" font-size="16" text-anchor="end" fill="#9AA6B5">0</text>
<text x="32" y="502.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">CS</text>
<text x="32" y="548.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SCLK</text>
<text x="32" y="594.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SDI</text>
<text x="390" y="594.3" font-size="16" font-weight="600" text-anchor="middle" fill="#FDE68A">0x01</text>
<text x="690" y="594.3" font-size="16" font-weight="600" text-anchor="middle" fill="#BFDBFE">address</text>
<text x="990" y="594.3" font-size="16" font-weight="600" text-anchor="middle" fill="#FDE68A">0x01</text>
<text x="32" y="640.3" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SDOUT</text>
<text x="540" y="640.3" font-size="16" font-weight="600" text-anchor="middle" fill="#BBF7D0">16-bit register value</text>
<text x="990" y="640.3" font-size="16" font-weight="600" text-anchor="middle" fill="#E2E8F0">0x00</text>
<text x="32" y="682.3" font-size="16" fill="#9AA6B5">SPI mode 0: SCLK idles low; the chip samples its input on the rising edge and changes its output after the falling edge. CS stays low for the</text>
<text x="32" y="705.5" font-size="16" fill="#9AA6B5">whole frame.</text>
</svg>
