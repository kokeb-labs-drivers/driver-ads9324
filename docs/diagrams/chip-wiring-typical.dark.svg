<text x="50" y="766.5" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="790" font-size="17" fill="#FECDD3">+5V: AVDD_5V · +1V8: AVDD_1V8 · +3V3: IOVDD, REFSEL; also U2.VDD · GND: EPAD, GND, REFM; also U2.GND</text>
<text x="50" y="859.5" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="883" font-size="17" fill="#E2E8F0">Support parts: 10 capacitors, 2 resistors around the supplies (values in the full schematic). 38 pins are not drawn in this circuit;</text>
<text x="50" y="907.6" font-size="17" fill="#E2E8F0">the full schematic lists them.</text>
<text x="32" y="953.6" font-size="16" fill="#9AA6B5">* Not confirmed in the datasheet: net +3V3: example IOVDD; the data sheet allows 1.7 V to 3.6 V. REFSEL high selects the internal reference;</text>
<text x="32" y="976.7" font-size="16" fill="#9AA6B5">R1: REXT: the data sheet gives no value; choose it for the source and the input filter; R2: REXT: matched to R1 so the positive and negative</text>
<text x="32" y="999.7" font-size="16" fill="#9AA6B5">paths see equal source resistance; C10: CEXT: the data sheet gives no value; it sets the filter corner with REXT.</text>
