<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1067" viewBox="0 0 1200 1067" role="img" aria-labelledby="chip-wiring-typical-title chip-wiring-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-typical-title">Wiring: Typical application</title>
<desc id="chip-wiring-typical-desc">Wiring of the ADS9324 for the Typical application: MCU SPI SCK to SCLK (Transfer()); MCU SPI MOSI to SDI (Transfer()); MCU SPI MISO to SDOUT (Transfer()); MCU GPIO / CS to CS (Transfer()); MCU GPIO to RESET (GpioSet(CtrlPin::Reset)); MCU GPIO / timer to CONVST (GpioSet(CtrlPin::Convst)); MCU GPIO (IRQ) to DRDY/ALARM (GpioGet(CtrlPin::DrdyAlarm)). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="1066" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">Wiring: Typical application</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">Hardware page. Datasheet: 9.2 Typical Application, Figure 9-2, p. 107.</text>
