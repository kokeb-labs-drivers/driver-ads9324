<svg xmlns="http://www.w3.org/2000/svg" width="638" height="343" viewBox="0 0 638 343" role="img" aria-labelledby="spi-register-read-title spi-register-read-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="spi-register-read-title">One register read on the SPI bus</title>
<desc id="spi-register-read-desc">A register read on the ADS9324 SPI bus: the host sends the read command inside one chip-select frame, then clocks out a second frame in which the chip returns the value on SDOUT.</desc>
