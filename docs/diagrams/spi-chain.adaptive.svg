<defs><marker id="spi-chain-arrow-brand-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fk-f-brand-strong"/></marker></defs>
<rect x="0.5" y="0.5" width="639" height="761" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">Configuration SPI daisy chain</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Datasheet: 7.3.14.2 Daisy Chain, Figure 7-29, p. 43.</text>
<rect x="32" y="118.7" width="576" height="1" class="fk-f-hair"/>
<path d="M106 241.9 L106 282.9" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-chain-arrow-brand-strong)" class="fk-s-brand-strong"/>
