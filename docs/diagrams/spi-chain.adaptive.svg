<rect x="32" y="579.9" width="576" height="152.1" rx="10" stroke-width="1" class="fk-f-slate-tint fk-s-slate-soft"/>
<text x="82" y="193.3" font-size="17" font-weight="700" class="fk-f-blue-text">Host</text>
<text x="82" y="221.1" font-size="15" class="fk-f-ink2">SPI controller</text>
<text x="82" y="314.3" font-size="17" font-weight="700" class="fk-f-teal-text">ADC2</text>
<text x="82" y="342.1" font-size="15" class="fk-f-ink2">DAISY_CHN_LOC = 1</text>
<text x="82" y="363.8" font-size="15" class="fk-f-ink2">first on PICO</text>
<text x="82" y="457.3" font-size="17" font-weight="700" class="fk-f-teal-text">ADC1</text>
<text x="82" y="485.1" font-size="15" class="fk-f-ink2">DAISY_CHN_LOC = 0</text>
<text x="82" y="506.8" font-size="15" class="fk-f-ink2">last in the chain</text>
<text x="118" y="267.8" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink2">PICO → SDI</text>
<text x="118" y="410.8" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink2">SDOUT → SDI</text>
<text x="118" y="548.3" font-size="15" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink2">SDOUT → POCI</text>
<text x="530.4" y="164.9" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">SCLK</text>
<circle cx="530.4" cy="180.9" r="3.6" class="fk-f-ink2"/>
<circle cx="530.4" cy="301.9" r="3.6" class="fk-f-ink2"/>
<circle cx="530.4" cy="444.9" r="3.6" class="fk-f-ink2"/>
<text x="582.1" y="164.9" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">CS</text>
<circle cx="582.1" cy="190.9" r="3.6" class="fk-f-ink2"/>
<circle cx="582.1" cy="311.9" r="3.6" class="fk-f-ink2"/>
<circle cx="582.1" cy="454.9" r="3.6" class="fk-f-ink2"/>
<text x="46" y="608.3" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="628.8" font-size="15" class="fk-f-slate-text">A register read or write takes 32 SCLK per device in the chain instead of</text>
<text x="46" y="650.5" font-size="15" class="fk-f-slate-text">24 (7.3.14.2, p. 43). Every device needs DAISY_CHN_NUM,</text>
<text x="46" y="672.2" font-size="15" class="fk-f-slate-text">DAISY_CHN_LOC and DOUT_LANE_SEL set, then DAISY_CHN_EN = 1</text>
<text x="46" y="694" font-size="15" class="fk-f-slate-text">(7.3.14.2, p. 43). Data on 1, 2 or 4 lanes only; not with the data on</text>
<text x="46" y="715.8" font-size="15" class="fk-f-slate-text">SDOUT (7.3.14.2, p. 43).</text>
</svg>
