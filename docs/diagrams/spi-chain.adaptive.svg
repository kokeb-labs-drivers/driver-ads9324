<path d="M106 527.9 L106 535.4 Q106 542.9 98.5 542.9 L48 542.9 Q40 542.9 40 534.9 L40 209.9 Q40 201.9 48 201.9 L59 201.9" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#spi-chain-arrow-brand-strong)" class="fk-s-brand-strong"/>
