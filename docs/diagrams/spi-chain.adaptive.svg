<path d="M478.5 454.9 L582.1 454.9" fill="none" stroke-width="1.8" class="fk-s-ink2"/>
<rect x="62" y="164.9" width="416.5" height="74" rx="10" stroke-width="1.4" class="fk-f-blue-tint fk-s-blue-strong"/>
<rect x="62" y="172.9" width="4" height="58" rx="2" class="fk-f-blue-strong"/>
<rect x="62" y="285.9" width="416.5" height="96" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<rect x="62" y="293.9" width="4" height="80" rx="2" class="fk-f-teal-strong"/>
<rect x="62" y="428.9" width="416.5" height="96" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
