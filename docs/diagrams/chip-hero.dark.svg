<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="793" viewBox="0 0 1200 793" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">ADS9324</title>
<desc id="chip-hero-desc">Overview of the ADS9324, a 16-channel, 16-bit SAR ADC that samples all of its inputs at the same instant at up to 1 MSPS, each through its own programmable-gain front end with 1 MΩ input impedance, so sensors and transformers connect without drivers. A MCU talks to it over SPI, 1 to 8 data lanes; it drives DRDY/ALARM line; it reads back Sensors and transformers. Headline figures: 16 x 16-bit inputs sampled at one instant; 1 MSPS on each channel; ±12.5 V widest input range; down to ±2.5 V; 1 MΩ input impedance of the PGA; 4.096 V internal reference, 15 ppm/°C typical; 8 x 8 mm VQFN-64 body.</desc>
